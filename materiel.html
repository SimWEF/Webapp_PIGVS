<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>État du matériel</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0078D7">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <header class="app-header">
    <a class="back" href="index.html">‹</a>
    <h1>📊 État du matériel</h1>
  </header>

  <div class="container">
    <div id="listeSousEnsembles">
      <div class="empty">Chargement…</div>
    </div>
  </div>

<script>
fetch("sousEnsemble.json")
  .then(r => r.json())
  .then(data => {
    const container = document.getElementById("listeSousEnsembles");
    container.innerHTML = "";

    if (!data || data.length === 0) {
      container.innerHTML = '<div class="empty">Aucun sous-ensemble à afficher.</div>';
      return;
    }

    data.forEach(item => {
      let cls = "gris", emoji = "⚪";
      if (item.etat === "VERT")   { cls = "vert";   emoji = "🟢"; }
      if (item.etat === "ORANGE") { cls = "orange"; emoji = "🟠"; }
      if (item.etat === "ROUGE")  { cls = "rouge";  emoji = "🔴"; }

      const card = document.createElement("div");
      card.className = "card clickable etat-" + cls;
      card.onclick = () => ouvrirSousEnsemble(item.nom);
      card.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
          <div>
            <div style="font-size:17px;font-weight:700">${item.nom}</div>
            <div style="font-size:14px;color:var(--muted);margin-top:2px">
              ${item.utilisables}/${item.total} utilisables
            </div>
          </div>
          <span class="badge ${cls}">${emoji}</span>
        </div>`;
      container.appendChild(card);
    });
  })
  .catch(() => {
    document.getElementById("listeSousEnsembles").innerHTML =
      '<div class="empty">Impossible de charger les données.</div>';
  });

function ouvrirSousEnsemble(nomSousEnsemble){
  localStorage.setItem("sousEnsembleSelectionne", nomSousEnsemble);
  window.location.href = "detailSousEnsemble.html";
}
</script>
</body>
</html>
