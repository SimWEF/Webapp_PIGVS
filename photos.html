<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photos — PIGVS</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .back-link { display:inline-block; margin:10px 0; text-decoration:none; color:#0078D7; font-weight:bold; }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0078D7">
  <link rel="apple-touch-icon" href="icon-192.png">

<body>
  <header class="app-header">
    <a class="back" href="index.html">‹</a>
    <h1>📷 Photos</h1>
  </header>
  <div class="container">
    <p class="info" style="color:var(--muted)">Choisissez le type de photo</p>

    <a class="card clickable" href="photo.html?type=colisage-conteneur"
       style="display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit">
      <div style="font-size:32px">📦</div>
      <div><div style="font-size:17px;font-weight:700">Colisage conteneur</div>
      <div style="font-size:13px;color:var(--muted)">Site · Conteneur</div></div>

    <a class="card clickable" href="photo.html?type=colisage-caisse"
       style="display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit">

      <div style="font-size:13px;color:var(--muted)">Site · Caisse</div></div>
    </a>

    <a class="card clickable" href="photo.html?type=cahier-quart"

      <div style="font-size:13px;color:var(--muted)">Site · GV · Activité · Date · Poste</div></div>

    <a class="card clickable" href="photo.html?type=portee-joint"

    <a class="card clickable" href="photo.html?type=condition-acces"

      <div style="font-size:13px;color:var(--muted)">Site · Commentaire</div></div>
    </a>

    <a class="card clickable" href="photo.html?type=autre"
       style="display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit">
